services:
  vcs-editor-service:
    build:
      context: ../..
      dockerfile: apps/vcs-editor-service/Dockerfile
    image: vcs-editor-service:latest
    container_name: vcs-editor-service
    restart: unless-stopped
    environment:
      - PORT=3000
      - OUTPUT_DIR=/app/output
      - EDITOR_SERVICE_TOKEN=${EDITOR_SERVICE_TOKEN:?set EDITOR_SERVICE_TOKEN}
      - RENDER_CONCURRENCY=${RENDER_CONCURRENCY:-1}
      - RUNNEL_URL=${RUNNEL_URL:-}
      - RUNNEL_NAMESPACE=${RUNNEL_NAMESPACE:-editor}
      - RUNNEL_KEY=${RUNNEL_KEY:-}
      - CHROMIUM_SLOTS=${CHROMIUM_SLOTS:-1}
      - LANE_PREPARE_CONCURRENCY=${LANE_PREPARE_CONCURRENCY:-2}
      - WORK_MIN_FREE_MB=${WORK_MIN_FREE_MB:-1024}
      - SEGMENT_CACHE_MB=${SEGMENT_CACHE_MB:-6000}
      - RENDER_CACHE_MB=${RENDER_CACHE_MB:-2000}
      - REMOTION_PLUGIN=${REMOTION_PLUGIN:-}
    networks:
      - traefik
      - editor
    stop_grace_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vcs-editor-service.rule=Host(`${EDITOR_HOST:-renderer-svc.kinoforge.dev}`)"
      - "traefik.http.routers.vcs-editor-service.entrypoints=websecure"
      - "traefik.http.routers.vcs-editor-service.tls=true"
      - "traefik.http.routers.vcs-editor-service.tls.certresolver=letsencrypt"
      - "traefik.http.services.vcs-editor-service.loadbalancer.server.port=3000"
    volumes:
      - ./.volume/output:/app/output
      - ./.volume/plugins:/plugins:ro
    # Headless Chromium needs more than Docker's 64 MB /dev/shm or renders crash.
    shm_size: ${EDITOR_SHM:-1gb}
    cpus: ${EDITOR_CPUS:-2}
    mem_limit: ${EDITOR_MEMORY:-4g}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  runnel:
    image: ghcr.io/kinoforge/runnel:${RUNNEL_VERSION:-0.0.4-beta.2}
    container_name: vcs-editor-runnel
    profiles: ["runnel"]
    restart: unless-stopped
    command: ["serve"]
    environment:
      - RUNNEL_STORE=hybrid:/data/runnel
      - RUNNEL_ADMIN_TOKEN=${RUNNEL_ADMIN_TOKEN:?set RUNNEL_ADMIN_TOKEN}
      - RUNNEL_MAINTAINER_RETENTION_COMPLETED=72h
      - RUNNEL_MAINTAINER_RETENTION_CANCELLED=72h
      - RUNNEL_MAINTAINER_RETENTION_DEAD=168h
      - RUNNEL_MAINTAINER_RETENTION_EVENTS=168h
    volumes:
      - runnel-data:/data
    networks:
      - editor
    mem_limit: 256m
    labels:
      - "traefik.enable=false"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  runnel-data:

networks:
  traefik:
    external: true
  editor:
    name: vcs-editor
    internal: true
